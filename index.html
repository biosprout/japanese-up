<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#B03A48">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JAPANESE UP!">
<title>JAPANESE UP! 中学国語</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F4F2;--panel:#FFFFFF;--panel2:#F0EAE8;
    --primary:#B03A48;--primary-dark:#8A2B37;--accent:#C79A2E;
    --danger:#D0303F;--text:#1F1A1A;--sub:#7A6E6E;--border:#E5DCDA;
    --shadow:0 8px 28px rgba(176,58,72,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Noto Sans JP',system-ui,sans-serif;color:var(--text);
    background:radial-gradient(circle at 20% 0%,#EFE3E3 0%,#F7F4F2 55%);min-height:100dvh;display:flex;justify-content:center}
  .app{width:100%;max-width:480px;min-height:100dvh;display:flex;flex-direction:column;position:relative}
  .topbar{padding:18px 20px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;
    background:linear-gradient(180deg,#FBF6F0 70%,rgba(251,246,240,0))}
  .brand .logo{font-family:'Poppins';font-weight:800;font-size:23px;letter-spacing:-.5px;color:var(--primary)}
  .brand .logo span{color:var(--accent)}
  .brand .sub{font-size:11px;color:var(--sub);font-weight:500;margin-top:2px}

  .hsec{background:var(--panel2);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:12px}
  .hsec h3{font-size:14px;font-weight:900;margin-bottom:8px;color:var(--accent)}
  .hsec p{font-size:12.5px;line-height:1.9;color:var(--text);font-weight:500;margin-bottom:8px}
  .hsec p:last-child{margin-bottom:0}
  .hlist{margin:6px 0 8px;padding-left:1.1em}
  .hlist li{font-size:12.5px;line-height:1.9;color:var(--sub);font-weight:500;margin-bottom:5px}
  .hlist li b{color:var(--text)}

  .helpbtn{background:var(--panel2);border:1px solid var(--border);border-radius:999px;
    width:34px;height:34px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:800;color:var(--accent);cursor:pointer;margin-right:8px}
  .helpbtn:active{transform:scale(.94)}
  .topbar .right{display:flex;align-items:center}
  .rankpill{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:800;color:var(--accent)}
  .screen{flex:1;overflow-y:auto;padding:6px 20px 40px;-webkit-overflow-scrolling:touch}
  .statcard{background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px;display:flex;align-items:center;gap:18px}
  .ring{position:relative;width:92px;height:92px;flex:0 0 auto}
  .ring svg{transform:rotate(-90deg)}
  .ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .in b{font-family:'Poppins';font-size:23px;font-weight:800;color:var(--primary);line-height:1}
  .ring .in small{font-size:9px;color:var(--sub);font-weight:600;margin-top:2px}
  .stinfo h2{font-size:15px;font-weight:900;margin-bottom:8px}
  .stinfo .row{display:flex;gap:16px}
  .stinfo .row div{font-size:11px;color:var(--sub);font-weight:600}
  .stinfo .row b{display:block;font-family:'Poppins';font-size:19px;color:var(--text);font-weight:700}
  .daily{display:flex;align-items:center;gap:13px;border-radius:20px;padding:15px 17px;margin-bottom:16px;cursor:pointer;
    background:linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 100%);color:#FFFFFF;box-shadow:0 6px 20px rgba(0,0,0,.13);transition:.15s}
  .daily:active{transform:scale(.985)}
  .daily.done{background:linear-gradient(135deg,#12A98A 0%,#3BB273 100%);color:#FFFFFF}
  .daily .dic{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.2);
    display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto}
  .daily .dbd{flex:1;min-width:0}
  .daily .dbd h3{font-size:16px;font-weight:900;letter-spacing:.2px;line-height:1.3}
  .daily .dbd p{font-size:11px;font-weight:600;opacity:.88;margin-top:3px;line-height:1.45}
  .daily .dbar{height:5px;border-radius:99px;background:rgba(255,255,255,.3);margin-top:8px;overflow:hidden}
  .daily .dbar i{display:block;height:100%;background:currentColor;border-radius:99px}
  .daily .dgo{font-size:12px;font-weight:800;background:rgba(255,255,255,.22);
    padding:8px 12px;border-radius:999px;flex:0 0 auto;white-space:nowrap}
  .vword{font-size:34px;font-weight:900;text-align:center;line-height:1.4;margin:6px 0 4px;letter-spacing:2px}
  .vword.sm{font-size:24px;letter-spacing:1px}
  .vsub{font-size:12px;color:var(--sub);font-weight:700;text-align:center}
  .vin{width:100%;margin-top:16px;padding:15px 14px;border:2px solid var(--border);border-radius:14px;
    font-size:22px;font-weight:800;text-align:center;background:var(--panel2);color:var(--text);
    font-family:inherit;outline:none;-webkit-appearance:none}
  .vin:focus{border-color:var(--primary)}
  .vin.ok{border-color:var(--primary);background:#EAF6EE}
  .vin.ng{border-color:var(--danger);background:#FDECEE}
  .vhint{margin-top:10px;font-size:15px;font-weight:800;letter-spacing:4px;color:var(--sub);text-align:center;min-height:22px}
  .vcard{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:34px 18px;
    box-shadow:var(--shadow);margin-bottom:14px;cursor:pointer;min-height:180px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  .vcard .mean{font-size:17px;font-weight:700;line-height:1.7;text-align:center}
  .vcard .tap{font-size:11px;color:var(--sub);font-weight:700}
  .vtag{display:inline-block;font-size:10px;font-weight:800;padding:3px 9px;border-radius:99px;
    background:var(--panel2);color:var(--sub)}
  .catrow{display:flex;align-items:center;font-size:12px;font-weight:700;padding:7px 0;border-bottom:1px solid var(--border)}
  .catrow:last-child{border:0}
  .catrow .cn{flex:0 0 auto;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .catbar{height:6px;border-radius:99px;background:var(--border);overflow:hidden;flex:1;margin:0 10px}
  .catbar i{display:block;height:100%;border-radius:99px;background:var(--primary)}
  .catbar i.bad{background:var(--danger)}
  .catbar i.mid{background:var(--accent)}
  .catrow .cv{font-family:'Poppins';flex:0 0 auto;color:var(--sub)}
  .label{font-size:12px;font-weight:800;color:var(--sub);margin:10px 2px 10px;letter-spacing:.3px}
  .lvrow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:6px}
  .lvbtn{background:var(--panel);border:1.5px solid var(--border);border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;transition:.15s}
  .lvbtn:active{transform:scale(.97)}
  .lvbtn .n{font-size:13px;font-weight:900;display:block}
  .lvbtn .d{font-size:9px;color:var(--sub);font-weight:600;margin-top:3px;display:block}
  .lvbtn.on{background:var(--primary);border-color:var(--primary);color:#FFFFFF}
  .lvbtn.on .d{color:rgba(8,32,26,.7)}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .fbtn{background:var(--panel);border:1.5px solid var(--border);border-radius:15px;padding:14px;cursor:pointer;transition:.15s;text-align:left}
  .fbtn:active{transform:scale(.98)}
  .fbtn .ic{font-size:20px}
  .fbtn .n{font-size:13px;font-weight:800;margin-top:5px}
  .fbtn .m{font-size:10px;color:var(--sub);font-weight:600;margin-top:3px}
  .fbtn .bar{height:4px;background:var(--border);border-radius:99px;margin-top:8px;overflow:hidden}
  .fbtn .bar i{display:block;height:100%;background:var(--primary);border-radius:99px}
  .btn{border:none;border-radius:14px;font-family:inherit;font-weight:800;font-size:15px;padding:15px;cursor:pointer;transition:.15s;width:100%}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--primary);color:#FFFFFF}
  .btn-ghost{background:var(--panel);color:var(--primary);border:1.5px solid var(--border)}
  .btn-accent{background:var(--accent);color:#6B4A00}
  .back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--sub);font-weight:700;font-size:14px;cursor:pointer;padding:6px 2px;margin-bottom:6px;font-family:inherit}
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .qhead .left{display:flex;align-items:center;gap:10px}
  .qhead h2{font-size:16px;font-weight:900}
  .timer{font-family:'Poppins';font-weight:800;font-size:20px;color:var(--accent)}
  .timer.warn{color:var(--danger)}
  .combo{font-family:'Poppins';font-weight:800;font-size:13px;color:var(--accent)}
  .bar-top{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:16px}
  .bar-top i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
  .qcard{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:22px 18px;box-shadow:var(--shadow);margin-bottom:14px}
  .qmeta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .tagf{font-size:10px;font-weight:800;color:var(--primary);letter-spacing:.4px}
  .taglv{font-size:9px;padding:3px 8px;border-radius:7px;font-weight:800}
  .taglv.easy{background:#F7E9D8;color:#C2571F}
  .taglv.std{background:#FFF6E2;color:var(--accent)}
  .taglv.hard{background:#FFE8EC;color:var(--danger)}
  .taglv.ibo{background:#F0E6FA;color:#7A3FC4}
  .lvbtn .n{font-size:12px}
  .qtext{font-size:17px;font-weight:700;line-height:1.55}
  .choices{display:grid;gap:9px}
  .choice{background:var(--panel);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;font-family:inherit;font-size:15px;font-weight:700;
    color:var(--text);cursor:pointer;text-align:left;transition:.12s;line-height:1.45}
  .choice:active{transform:scale(.99)}
  .choice.correct{background:var(--primary);border-color:var(--primary);color:#FFFFFF}
  .choice.wrong{background:var(--danger);border-color:var(--danger);color:#7A0012}
  .choice.dim{opacity:.4}
  .exp{border-radius:14px;padding:15px;margin-top:12px;font-size:13px;line-height:1.65;background:var(--panel2);border:1px solid var(--border)}
  .exp b{color:var(--primary)}
  .result{text-align:center;padding:26px 10px}
  .result .rank{font-family:'Poppins';font-size:62px;font-weight:800;line-height:1;color:var(--accent)}
  .result .emoji{font-size:48px;margin-bottom:4px}
  .result .big{font-family:'Poppins';font-size:44px;font-weight:800;color:var(--primary);line-height:1;margin-top:6px}
  .result h2{font-size:18px;font-weight:900;margin:10px 0 4px}
  .result p{color:var(--sub);font-weight:600;font-size:13px;margin-bottom:6px}
  .misslist{text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:4px;margin:14px 0;max-height:260px;overflow-y:auto}
  .misslist .r{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;line-height:1.5}
  .misslist .r:last-child{border:none}
  .misslist .r .q{font-weight:700;margin-bottom:4px}
  .misslist .r .a{color:var(--primary);font-weight:700;font-size:12px}
  .lvstat{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .lvstat:last-child{margin-bottom:0}
  .lvstat .ln{font-size:10px;font-weight:800;width:50px;flex:0 0 auto}
  .lvstat .ln.lv-easy{color:#C2571F}
  .lvstat .ln.lv-std{color:var(--accent)}
  .lvstat .ln.lv-hard{color:var(--danger)}
  .lvstat .ln.lv-ibo{color:#7A3FC4}
  .lvstat .lb{flex:1;height:6px;background:var(--border);border-radius:99px;overflow:hidden}
  .lvstat .lb i{display:block;height:100%;border-radius:99px}
  .lvstat .lb i.lv-easy{background:#C2571F}
  .lvstat .lb i.lv-std{background:var(--accent)}
  .lvstat .lb i.lv-hard{background:var(--danger)}
  .lvstat .lb i.lv-ibo{background:#7A3FC4}
  .lvstat .lnum{font-family:'Poppins';font-size:10px;font-weight:700;color:var(--sub);width:48px;text-align:right;flex:0 0 auto}
  .lvstat .lrate{font-family:'Poppins';font-size:10px;font-weight:800;width:34px;text-align:right;flex:0 0 auto}
  .ach-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .achb{background:var(--panel);border:1.5px solid var(--border);border-radius:12px;padding:9px 8px;opacity:.5}
  .achb.got{opacity:1;border-color:var(--accent);background:#FFF6E2}
  .achb .an{font-size:10px;font-weight:800;line-height:1.3}
  .achb .ad{font-size:8px;color:var(--sub);font-weight:600;margin-top:3px;line-height:1.3}
    .evr{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:11px 13px;margin-bottom:7px;opacity:.45}
  .evr.got{opacity:1}
  .evr.cur{border-color:var(--accent);background:#FFF6E2;box-shadow:0 0 0 1.5px var(--accent) inset}
  .evr .evn{font-family:'Poppins';font-size:11px;font-weight:800;color:var(--sub);width:20px;flex:0 0 auto;text-align:right}
  .evr .eve{font-size:22px;flex:0 0 auto}
  .evr .evb{flex:1;min-width:0}
  .evr .evt{font-size:13px;font-weight:800;line-height:1.35}
  .evr .evd{font-family:'Poppins';font-size:10px;color:var(--sub);font-weight:700;margin-top:2px}
  .evr.cur .evd{color:var(--accent)}
  .zkr{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;opacity:.55}
  .zkr.got{opacity:1}
  .zke{font-size:26px;flex:0 0 auto}
  .zkb{flex:1}
  .zkn{font-size:13px;font-weight:900}
  .zkd{font-size:11px;color:var(--sub);font-weight:600;line-height:1.5;margin-top:3px}
  .zktag{font-size:8px;padding:2px 7px;border-radius:6px;font-weight:800;vertical-align:1px}
  .dupn{font-family:Poppins;font-size:10px;font-weight:800;color:var(--accent);margin-left:2px}
  .zktag.N{background:#EADFD2;color:#7D6A57}
  .zktag.R{background:#F7E9D8;color:#C2571F}
  .zktag.SR{background:#F7E9D8;color:var(--accent)}
  .zktag.H{background:#E9ECFF;color:#4A57C4}
  .row2{display:flex;gap:10px}
  .row2 .btn{flex:1}
  .help{font-size:11px;color:var(--sub);line-height:1.6;margin-top:8px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:12px 22px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .pop{position:fixed;inset:0;pointer-events:none;z-index:40}
  .pop span{position:absolute;left:50%;top:45%;font-size:24px;animation:fly .8s ease-out forwards}
  @keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><div class="logo">JAPANESE <span>UP!</span></div><div class="sub">中学国語 / 中1〜高校受験</div></div>
    <button class="helpbtn" onclick="renderHelp()" aria-label="使い方">？</button><div class="rankpill" id="rankPill">総合 --</div>
  </div>
  <div id="updBar" style="display:none;align-items:center;gap:10px;background:var(--accent);color:#1A1400;padding:10px 14px;border-radius:12px;margin:0 0 12px;font-size:13px;font-weight:700">
    <b style="flex:1">新しいバージョンがあります</b>
    <button onclick="forceUpdate()" style="background:#1A1400;color:var(--accent);border:0;border-radius:8px;padding:7px 12px;font-weight:800;font-size:12px">更新する</button>
  </div>
  <div style="display:none">
  </div>
  <div class="screen" id="screen"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const STORE_KEY='japaneseup_v1';
const OLD_KEYS=[];
try{ if(!localStorage.getItem(STORE_KEY)){
  for(const k of OLD_KEYS){const o=localStorage.getItem(k); if(o){localStorage.setItem(STORE_KEY,o);break;}}
} }catch(e){}
let mem=null;
const FIELDS=[
  ['kanji','漢字（読み・書き）'],
  ['goi','語彙（熟語・慣用句）'],
  ['bunpo','文法（品詞・敬語）'],
  ['koten','古文・漢文']
];
const Q=[
  {id:'k_e1',f:'kanji',lv:'easy',q:'「委ねる」の読みはどれか。',ch:['ゆだねる','おもねる','つらねる','かさねる'],a:0,ex:'ゆだねる。「委任」「委託」の委で、他人にまかせるという意味。'},
  {id:'k_e2',f:'kanji',lv:'easy',q:'「速やか」の読みはどれか。',ch:['すみやか','あざやか','おだやか','ゆるやか'],a:0,ex:'すみやか。送りがなが「やか」となる語は他に鮮やか・穏やかなどがある。'},
  {id:'k_e3',f:'kanji',lv:'easy',q:'「著しい」の読みはどれか。',ch:['いちじるしい','はなはだしい','おびただしい','けわしい'],a:0,ex:'いちじるしい。はっきりと目立つようす。「著」には「あらわす」の読みもある。'},
  {id:'k_e4',f:'kanji',lv:'easy',q:'「怠る」の読みはどれか。',ch:['おこたる','あやまる','いつわる','かたる'],a:0,ex:'おこたる。「怠慢」「怠惰」の怠。'},
  {id:'k_e5',f:'kanji',lv:'easy',q:'「募る」の読みはどれか。',ch:['つのる','あおる','みなぎる','かたよる'],a:0,ex:'つのる。「募集」の募で、呼びかけて集める、また程度が強まるの意味。'},
  {id:'k_e6',f:'kanji',lv:'easy',q:'「陥る」の読みはどれか。',ch:['おちいる','とどこおる','ひるがえる','うけたまわる'],a:0,ex:'おちいる。「陥没」「欠陥」の陥。'},
  {id:'k_e7',f:'kanji',lv:'easy',q:'「培う」の読みはどれか。',ch:['つちかう','やしなう','ともなう','になう'],a:0,ex:'つちかう。もとは土をかけて植物を育てる意味で、そこから力を養う意味に広がった。'},
  {id:'k_e8',f:'kanji',lv:'easy',q:'「潔い」の読みはどれか。',ch:['いさぎよい','とうとい','いやしい','まぎらわしい'],a:0,ex:'いさぎよい。「清潔」「潔白」の潔。'},
  {id:'k_e9',f:'kanji',lv:'easy',q:'「かんき」で「大声で呼びかけて注意を促す」意味の漢字はどれか。',ch:['喚起','歓喜','換気','乾期'],a:0,ex:'喚起。歓喜は喜び、換気は空気の入れ替え、乾期は雨の少ない時期。'},
  {id:'k_e10',f:'kanji',lv:'easy',q:'「たいしょう」で「二つを比べる」意味の漢字はどれか。',ch:['対照','対称','対象','大将'],a:0,ex:'対照。対称は左右がつり合うこと、対象は働きかける相手。'},
  {id:'k_e11',f:'kanji',lv:'easy',q:'「ほしょう」で「損害を金銭で埋め合わせる」意味の漢字はどれか。',ch:['補償','保障','保証','歩硝'],a:0,ex:'補償。保障は権利を守ること、保証は間違いないと請け合うこと。'},
  {id:'k_e12',f:'kanji',lv:'easy',q:'「かいほう」で「病人の世話をする」意味の漢字はどれか。',ch:['介抱','解放','開放','快方'],a:0,ex:'介抱。解放は自由にすること、開放は開け放つこと、快方は病気がよくなること。'},
  {id:'k_e13',f:'kanji',lv:'easy',q:'「せいさん」で「きちんと計算し直して整理する」意味の漢字はどれか。',ch:['清算','成算','精算','生産'],a:2,ex:'精算は金額を細かく計算すること。清算は貸し借りや関係を整理して終わらせること。'},
  {id:'k_e14',f:'kanji',lv:'easy',q:'「ついきゅう」で「利益や幸福をどこまでも求める」意味の漢字はどれか。',ch:['追求','追及','追究','追給'],a:0,ex:'追求は求める、追及は責任を問いつめる、追究は学問的に深く調べる。'},
  {id:'k_e15',f:'kanji',lv:'easy',q:'「おさめる」で「学問や技術を身につける」意味の漢字はどれか。',ch:['修める','納める','収める','治める'],a:0,ex:'修める。納めるは受け取る側に渡す、収めるはしまう、治めるは統治する。'},
  {id:'k_e16',f:'kanji',lv:'easy',q:'「たずねる」で「質問する」意味の漢字はどれか。',ch:['尋ねる','訪ねる','伺ねる','問ねる'],a:0,ex:'尋ねる。訪ねるは人や場所を訪問すること。'},
  {id:'k_e17',f:'kanji',lv:'easy',q:'「はかる」で「相談する」意味の漢字はどれか。',ch:['諮る','計る','測る','量る'],a:0,ex:'諮る。「諮問」の諮。計るは時間や数、測るは長さや面積、量るは重さや容積。'},
  {id:'k_e18',f:'kanji',lv:'easy',q:'「うつす」で「病気などをうつらせる」意味の漢字はどれか。',ch:['移す','写す','映す','遷す'],a:0,ex:'移す。写すは書き写す、映すは映像を投じる。'},
  {id:'k_e19',f:'kanji',lv:'easy',q:'「ぜんあく」のように、意味が反対の漢字を重ねた熟語はどれか。',ch:['善悪','岩石','日照','高原'],a:0,ex:'善悪は反対の意味の組み合わせ。岩石は似た意味、日照は主語述語、高原は修飾関係。'},
  {id:'k_e20',f:'kanji',lv:'easy',q:'「読書」と同じ成り立ちの熟語はどれか。',ch:['登山','岩石','高低','日没'],a:0,ex:'読書と登山はどちらも「〜を…する」で、下の字が上の字の目的語になっている。'},
  {id:'k_s1',f:'kanji',lv:'std',q:'「忌憚のない意見」の「忌憚」の読みと意味の組み合わせはどれか。',ch:['きたん・遠慮','きだん・冗談','いたん・異論','きけん・危険'],a:0,ex:'きたん。「忌憚のない」で遠慮のない、率直なという意味になる。'},
  {id:'k_s2',f:'kanji',lv:'std',q:'「破綻」の読みはどれか。',ch:['はたん','はじょう','はてい','はさく'],a:0,ex:'はたん。もとは布のほころびの意味で、そこから物事が成り立たなくなる意味に。'},
  {id:'k_s3',f:'kanji',lv:'std',q:'「示唆」の読みはどれか。',ch:['しさ','しさく','じさ','しめさ'],a:0,ex:'しさ。それとなく示すこと。「示唆に富む」のように使う。'},
  {id:'k_s4',f:'kanji',lv:'std',q:'「進捗」の読みはどれか。',ch:['しんちょく','しんぽ','しんてん','しんしょう'],a:0,ex:'しんちょく。物事が進みはかどること。'},
  {id:'k_s5',f:'kanji',lv:'std',q:'「顕著」の読みと意味の組み合わせとして正しいものはどれか。',ch:['けんちょ・はっきり目立つ','けんしょ・かすかな','げんちょ・当然の','けんちょ・めずらしい'],a:0,ex:'けんちょ。だれの目にもはっきりわかるほど目立つこと。'},
  {id:'k_s6',f:'kanji',lv:'std',q:'「かんしん」で「深く感じて心を動かされる」意味の漢字はどれか。',ch:['感心','関心','歓心','寒心'],a:0,ex:'感心。関心は興味、歓心は喜ぶ気持ち（歓心を買う）、寒心はぞっとすること。'},
  {id:'k_s7',f:'kanji',lv:'std',q:'「いぎ」で「異なる意見を唱える」意味の漢字はどれか。',ch:['異議','意義','威儀','異義'],a:0,ex:'異議。意義は価値や意味、威儀は礼儀正しい態度。「異議を唱える」「意義がある」。'},
  {id:'k_s8',f:'kanji',lv:'std',q:'「かてい」で「物事が進んでいく道すじ」を表す漢字はどれか。',ch:['過程','課程','家庭','仮定'],a:0,ex:'過程はプロセス、課程は学校のカリキュラム、仮定は仮に決めること。'},
  {id:'k_s9',f:'kanji',lv:'std',q:'「たいせい」で「物事を受け入れる構えや仕組み」を表す漢字はどれか。',ch:['体制','態勢','大勢','体勢'],a:1,ex:'態勢は一時的な身構え。体制は社会や組織の恒常的な仕組み、体勢は体の構え。'},
  {id:'k_s10',f:'kanji',lv:'std',q:'「絶体絶命」の「体」を「対」と書くのが誤りである理由はどれか。',ch:['体と命がともに窮まる状況を表す語だから','対義語ではないから','四字熟語だから','当て字だから'],a:0,ex:'身も命も追いつめられた状態を表す。「絶対」とは無関係な語源をもつ。'},
  {id:'k_s11',f:'kanji',lv:'std',q:'「未曾有」の読みはどれか。',ch:['みぞう','みそゆう','びぞう','みぞうゆう'],a:0,ex:'みぞう。「いまだ曽て有らず」で、これまで一度もなかったこと。'},
  {id:'k_s12',f:'kanji',lv:'std',q:'「相殺」の読みはどれか。',ch:['そうさい','そうさつ','あいさつ','そうざん'],a:0,ex:'そうさい。差し引いて損得をなくすこと。「殺」を「さい」と読む例。'},
  {id:'k_h1',f:'kanji',lv:'hard',q:'「うがった見方」の本来の意味はどれか。',ch:['物事の本質を的確にとらえた見方','ひねくれた見方','大げさな見方','浅い見方'],a:0,ex:'「穿つ」は掘り下げる意味で、本来は本質を見抜くこと。ひねくれた見方の意で使うのは本来の用法ではない。'},
  {id:'k_h2',f:'kanji',lv:'hard',q:'「憮然」の本来の意味はどれか。',ch:['失望して呆然とするようす','腹を立てているようす','平然としているようす','喜んでいるようす'],a:0,ex:'本来は落胆してぼんやりするようす。腹を立てる意味で使われることが多いが本来とは異なる。'},
  {id:'k_h3',f:'kanji',lv:'hard',q:'「役不足」の本来の意味はどれか。',ch:['本人の力量に対して役目が軽すぎること','力量が足りないこと','人手が足りないこと','役に立たないこと'],a:0,ex:'謙遜のつもりで「私では役不足です」と言うと逆の意味になる。正しくは「力不足」。'},
  {id:'k_h4',f:'kanji',lv:'hard',q:'「情けは人の為ならず」の本来の意味はどれか。',ch:['人に親切にすればめぐりめぐって自分に返る','甘やかすとその人のためにならない','情けは無用である','人助けは損である'],a:0,ex:'「人の為ならず」は「その人のためだけではない」の意。'},
  {id:'k_h5',f:'kanji',lv:'hard',q:'「破天荒」の本来の意味はどれか。',ch:['前例のないことを初めて成しとげること','豪快で大胆なこと','型破りで乱暴なこと','荒々しいこと'],a:0,ex:'未開の地を切り開く意味から。豪快の意で使われることが多いが本来とは異なる。'},
  {id:'k_h6',f:'kanji',lv:'hard',q:'「他山の石」の正しい使い方はどれか。',ch:['他人の誤りを自分の戒めとする','他人の成功を手本にする','無関係なこととして扱う','人を批判する'],a:0,ex:'よその山の粗悪な石でも自分の玉を磨くのに役立つ、という故事から。よい手本には使わない。'},
  {id:'g_e1',f:'goi',lv:'easy',q:'「一石二鳥」の意味はどれか。',ch:['一つのことで二つの利益を得る','二つとも失う','二度手間になる','どちらも中途半端'],a:0,ex:'1つの石で2羽の鳥を落とす意味。似た意味に「一挙両得」。'},
  {id:'g_e2',f:'goi',lv:'easy',q:'「五里霧中」の意味はどれか。',ch:['どうしてよいか見当がつかない','遠くまで見通せる','霧が深い天気','道に迷うこと'],a:0,ex:'深い霧の中にいるように、方針や見通しが立たないこと。「夢中」と書くのは誤り。'},
  {id:'g_e3',f:'goi',lv:'easy',q:'「試行錯誤」の意味はどれか.',ch:['何度も試して失敗しながら方法を見つける','初めから正解を知っている','錯覚におちいる','試験に失敗する'],a:0,ex:'試みと失敗をくり返して解決に近づくこと。'},
  {id:'g_e4',f:'goi',lv:'easy',q:'「臨機応変」の意味はどれか。',ch:['その場に応じて適切に対応する','決まりを厳しく守る','あらかじめ計画する','変化を嫌う'],a:0,ex:'状況の変化に合わせて柔軟に処置すること。'},
  {id:'g_e5',f:'goi',lv:'easy',q:'「単刀直入」の意味はどれか。',ch:['前置きなしにいきなり本題に入る','遠回しに言う','一人で立ち向かう','短く話す'],a:0,ex:'1本の刀で敵陣に切り込む意味から。「短刀」と書くのは誤り。'},
  {id:'g_e6',f:'goi',lv:'easy',q:'「異口同音」の意味はどれか。',ch:['多くの人が同じことを言う','違うことを言い合う','声をそろえて歌う','同じ人が違うことを言う'],a:0,ex:'口は違っても言うことは同じ、の意味。'},
  {id:'g_e7',f:'goi',lv:'easy',q:'「言語道断」の意味はどれか。',ch:['もってのほかである','言葉が通じない','無口である','説明が長い'],a:0,ex:'言葉で言い表せないほどひどいこと。もとは仏教語で、真理は言葉では表せない意味だった。'},
  {id:'g_e8',f:'goi',lv:'easy',q:'「馬の耳に念仏」と同じ意味のことわざはどれか。',ch:['猫に小判','猿も木から落ちる','三人寄れば文殊の知恵','急がば回れ'],a:0,ex:'価値がわからない相手には無意味であること。「豚に真珠」も同じ。'},
  {id:'g_e9',f:'goi',lv:'easy',q:'「石橋をたたいて渡る」の意味はどれか。',ch:['非常に用心深い','せっかちである','危険をおかす','橋を壊す'],a:0,ex:'頑丈な石の橋でさえ確かめてから渡るほど慎重なこと。'},
  {id:'g_e10',f:'goi',lv:'easy',q:'「二階から目薬」の意味はどれか。',ch:['遠回しで効き目がない','高いところが好き','目が悪い','便利な方法'],a:0,ex:'もどかしく、効果が上がらないことのたとえ。'},
  {id:'g_e11',f:'goi',lv:'easy',q:'「情けは人の為ならず」に近い意味のことわざはどれか。',ch:['善は急げ','情けに報いあり','急がば回れ','沈黙は金'],a:1,ex:'人への親切がめぐって自分に返るという考え方。'},
  {id:'g_e12',f:'goi',lv:'easy',q:'「棚から牡丹餅」の意味はどれか。',ch:['思いがけない幸運','努力の成果','失敗すること','危険なこと'],a:0,ex:'苦労せずに幸運を得ること。略して「たなぼた」。'},
  {id:'g_e13',f:'goi',lv:'easy',q:'「油を売る」の意味はどれか。',ch:['むだ話をして仕事をなまける','商売をする','機械を整備する','人をだます'],a:0,ex:'江戸時代の髪油の行商人が客と長話をしたことに由来する。'},
  {id:'g_e14',f:'goi',lv:'easy',q:'「気が置けない」の意味はどれか。',ch:['遠慮がいらず気楽である','油断できない','気味が悪い','忘れられない'],a:0,ex:'気を遣わなくてよい、の意味。「油断できない」と誤解されやすい代表例。'},
  {id:'g_e15',f:'goi',lv:'easy',q:'「舌を巻く」の意味はどれか。',ch:['非常に感心する','秘密にする','うそをつく','早口で話す'],a:0,ex:'驚いて言葉が出ないほど感心すること。'},
  {id:'g_e16',f:'goi',lv:'easy',q:'「気の置けない友人」の「気の置けない」は褒め言葉か。',ch:['褒め言葉である','非難の言葉である','どちらでもない','状況による'],a:0,ex:'遠慮のいらない親しい間柄という褒め言葉。誤用に注意。'},
  {id:'g_s1',f:'goi',lv:'std',q:'「呉越同舟」の意味はどれか。',ch:['仲の悪い者どうしが同じ場に居合わせる','協力して事にあたる','船で旅をする','敵を打ち破る'],a:0,ex:'敵対する呉と越の人が同じ舟に乗る故事から。転じて協力する意味でも使われる。'},
  {id:'g_s2',f:'goi',lv:'std',q:'「臥薪嘗胆」の意味はどれか。',ch:['目的のために苦しみに耐える','薪を集める','病気で寝込む','ぜいたくをする'],a:0,ex:'たきぎの上に寝て苦い胆をなめる故事から、復讐や目的達成のために苦労を重ねること。'},
  {id:'g_s3',f:'goi',lv:'std',q:'「四面楚歌」の意味はどれか。',ch:['周囲がすべて敵で孤立している','歌を歌って励ます','四方から助けが来る','歌が上手なこと'],a:0,ex:'項羽が四方から楚の歌を聞いて味方の離反を悟った故事から。'},
  {id:'g_s4',f:'goi',lv:'std',q:'「杞憂」の意味はどれか。',ch:['取り越し苦労','正当な心配','深い悲しみ','大きな喜び'],a:0,ex:'杞の国の人が天が落ちてこないかと心配した故事から、無用の心配。'},
  {id:'g_s5',f:'goi',lv:'std',q:'「推敲」の由来として正しいものはどれか。',ch:['詩の字句を「推す」か「敲く」か悩んだ故事','文章を推薦する','敵を敲く','高く推す'],a:0,ex:'唐の詩人賈島が「僧は推す月下の門」か「敲く」かで迷った故事。文章を練り直す意味。'},
  {id:'g_s6',f:'goi',lv:'std',q:'「矛盾」の由来はどれか。',ch:['どんな盾も突き通す矛と、どんな矛も防ぐ盾を売った商人の話','戦いの武器の名前','中国の地名','矛と盾を組み合わせた道具'],a:0,ex:'韓非子の故事。話のつじつまが合わないことを表す。'},
  {id:'g_s7',f:'goi',lv:'std',q:'「蛇足」の意味はどれか。',ch:['よけいな付け足し','必要な補足','蛇の足','素早い動き'],a:0,ex:'蛇の絵に足を描き足して負けた故事から、不要なものを加えて台なしにすること。'},
  {id:'g_s8',f:'goi',lv:'std',q:'「圧巻」の本来の意味はどれか.',ch:['全体の中で最も優れた部分','壮大な光景','圧倒されること','巻物を押さえる'],a:0,ex:'科挙で最も優秀な答案を他の答案の上に置いた（圧した）ことに由来する。'},
  {id:'g_s9',f:'goi',lv:'std',q:'「枚挙にいとまがない」の意味はどれか。',ch:['数えきれないほど多い','数える時間がある','まったくない','めずらしい'],a:0,ex:'一つ一つ数え上げる暇がないほど多いこと。'},
  {id:'g_s10',f:'goi',lv:'std',q:'「割愛する」の本来の意味はどれか。',ch:['惜しみながら省く','不要なので捨てる','分けて与える','愛情を注ぐ'],a:0,ex:'惜しいと思うものを手放す意味。単に「省略する」とは語感が異なる。'},
  {id:'g_s11',f:'goi',lv:'std',q:'「敷居が高い」の本来の意味はどれか。',ch:['不義理をして訪ねにくい','高級すぎて入りにくい','段差が大きい','手続きが面倒'],a:0,ex:'相手に対して申し訳なさがあって行きにくいこと。高級で入りにくい意味は本来の用法ではない。'},
  {id:'g_s12',f:'goi',lv:'std',q:'「檄を飛ばす」の本来の意味はどれか。',ch:['自分の主張を広く知らせて同意を求める','激励する','怒鳴りつける','手紙を送る'],a:0,ex:'檄とは考えを記した文書。励ます意味で使われることが多いが本来とは異なる。'},
  {id:'g_h1',f:'goi',lv:'hard',q:'「捲土重来」の読みと意味の組み合わせはどれか。',ch:['けんどちょうらい・一度敗れた者が勢いを盛り返す','けんどじゅうらい・土に埋もれる','まきどちょうらい・重ねて来る','けんどちょうらい・土煙が舞う'],a:0,ex:'土煙を巻き上げる勢いで再び来る意味。「じゅうらい」とも読む。'},
  {id:'g_h2',f:'goi',lv:'hard',q:'「呉越同舟」と「同床異夢」に共通することはどれか。',ch:['同じ場にいながら思いが一致しない状況を表す','協力して成功する','別々の場所にいる','敵を倒す'],a:0,ex:'どちらも表面上は一緒でも内面が異なる状況を指す。'},
  {id:'g_h3',f:'goi',lv:'hard',q:'「換骨奪胎」の意味はどれか。',ch:['先人の作をもとに独自の作品を作る','骨を折って苦労する','体を鍛える','他人の作品を盗む'],a:0,ex:'骨を取り換え胎を奪う意味から、古人の詩文の発想を生かして新しく作ること。'},
  {id:'g_h4',f:'goi',lv:'hard',q:'「琴瑟相和す」の意味はどれか。',ch:['夫婦の仲がむつまじい','音楽が上手である','争いが絶えない','友情が深い'],a:0,ex:'琴と瑟という2つの楽器が調和する意味から、夫婦仲がよいこと。'},
  {id:'g_h5',f:'goi',lv:'hard',q:'「鼎の軽重を問う」の意味はどれか。',ch:['実力や資格を疑い問いただす','重さを量る','料理を作る','大切に扱う'],a:0,ex:'王権の象徴である鼎の重さを尋ねた故事から、権威者の実力を疑うこと。'},
  {id:'g_h6',f:'goi',lv:'hard',q:'「烏合の衆」の意味はどれか。',ch:['規律のない寄せ集めの集団','よく訓練された軍隊','少人数の精鋭','鳥の群れ'],a:0,ex:'カラスの群れのように統制のない集まり。'},

  {id:'g_h7',f:'goi',lv:'hard',q:'「泣いて馬謖を斬る」の意味はどれか。',ch:['規律を守るため私情を捨てて処分する','悲しんで泣く','人を許す','戦いに敗れる'],a:0,ex:'諸葛亮が愛弟子の馬謖を軍律違反で処刑した故事から。'},
  {id:'g_h8',f:'goi',lv:'hard',q:'「玉石混淆」の意味はどれか。',ch:['優れたものと劣ったものが入り混じる','宝石を集める','石を磨く','品質が均一'],a:0,ex:'玉（宝石）と石が混ざっている状態。「混交」とも書く。'},
  {id:'g_h9',f:'goi',lv:'hard',q:'「呉下の阿蒙」の意味はどれか。',ch:['学問を修めず昔のままの人','優秀な人物','呉の国の英雄','年長者'],a:0,ex:'「士別れて三日、刮目して相待すべし」と対になる故事。成長のない人を指す。'},
  {id:'g_h10',f:'goi',lv:'hard',q:'「杜撰」の意味と由来の組み合わせはどれか。',ch:['ずさん・杜黙という詩人の作が規則に合わなかった故事','ずさん・杜の中で書いた','とさん・撰者の名','ずさん・由来不明'],a:0,ex:'いいかげんで誤りが多いこと。'},
  {id:'g_h11',f:'goi',lv:'hard',q:'「鶏口となるも牛後となるなかれ」の意味はどれか。',ch:['大組織の末端より小組織の長がよい','牛を飼うべきだ','鶏を育てる','大きな組織に入るべきだ'],a:0,ex:'『史記』の故事。小さくても長になるほうがよいという教え。'},
  {id:'g_h12',f:'goi',lv:'hard',q:'「温故知新」「他山の石」「呉下の阿蒙」に共通する主題はどれか。',ch:['学びや成長のあり方','戦いの戦術','自然の描写','人間関係の対立'],a:0,ex:'いずれも学ぶ姿勢や自己の成長に関わる故事成語。'},
  {id:'b_e17',f:'bunpo',lv:'easy',q:'文節に区切るとき、目安となる言い方はどれか。',ch:['「ね」「さ」を入れて切れるところ','句読点のあるところ','漢字の切れ目','単語ごと'],a:0,ex:'「わたしはね、学校へね、行くよ」のように「ね」を入れて自然なところが文節の切れ目。'},
  {id:'b_e18',f:'bunpo',lv:'easy',q:'「美しい花が咲く」の主語はどれか。',ch:['花が','美しい','咲く','美しい花'],a:0,ex:'主語は「何が」にあたる文節。「花が」。'},
  {id:'b_e19',f:'bunpo',lv:'easy',q:'自立語だけで文節を作れないものはどれか。',ch:['助詞','名詞','動詞','副詞'],a:0,ex:'助詞と助動詞は付属語で、単独では文節を作れない。'},
  {id:'b_e20',f:'bunpo',lv:'easy',q:'「そして」「しかし」の品詞はどれか。',ch:['接続詞','副詞','連体詞','感動詞'],a:0,ex:'接続詞。文や語句をつなぐ働きをする。'},
  {id:'b_e21',f:'bunpo',lv:'easy',q:'「ああ」「もしもし」の品詞はどれか。',ch:['感動詞','接続詞','副詞','助詞'],a:0,ex:'感動詞。感動・呼びかけ・応答を表す。'},
  {id:'b_e22',f:'bunpo',lv:'easy',q:'活用のない自立語で、主語になれるものはどれか。',ch:['名詞','副詞','連体詞','接続詞'],a:0,ex:'名詞（体言）。「が」「は」を伴って主語になる。'},
  {id:'b_e23',f:'bunpo',lv:'easy',q:'動詞の活用形で、「ない」に続く形はどれか。',ch:['未然形','連用形','終止形','連体形'],a:0,ex:'未然形。「ます」に続くのは連用形、「とき」に続くのは連体形。'},
  {id:'b_e24',f:'bunpo',lv:'easy',q:'動詞の活用形で、「ば」に続く形はどれか。',ch:['仮定形','已然形','未然形','命令形'],a:0,ex:'現代語では仮定形。古文では已然形が「ば」に続くと確定条件になる。'},
  {id:'b_e25',f:'bunpo',lv:'easy',q:'「書く」の活用の種類はどれか。',ch:['五段活用','上一段活用','下一段活用','サ行変格活用'],a:0,ex:'「書かない」でア段になるので五段活用。'},
  {id:'b_e26',f:'bunpo',lv:'easy',q:'可能動詞にあたるものはどれか。',ch:['書ける','書かれる','書かせる','書きたい'],a:0,ex:'五段動詞から作られる下一段動詞。「書ける」「読める」など。'},
  {id:'b_e27',f:'bunpo',lv:'easy',q:'「言う」の尊敬語はどれか。',ch:['おっしゃる','申し上げる','申す','存じる'],a:0,ex:'おっしゃる。申す・申し上げるは謙譲語。'},
  {id:'b_e28',f:'bunpo',lv:'easy',q:'「見る」の尊敬語はどれか。',ch:['ご覧になる','拝見する','見られる','お目にかかる'],a:0,ex:'ご覧になる。拝見するは謙譲語。'},
  {id:'b_e29',f:'bunpo',lv:'easy',q:'「いる」の謙譲語はどれか。',ch:['おる','いらっしゃる','おいでになる','ございます'],a:0,ex:'おる。いらっしゃる・おいでになるは尊敬語。'},
  {id:'b_e30',f:'bunpo',lv:'easy',q:'丁寧語にあたるものはどれか。',ch:['です・ます','おっしゃる','いたす','召し上がる'],a:0,ex:'です・ます・ございます。聞き手への敬意を表す。'},
  {id:'b_e31',f:'bunpo',lv:'easy',q:'「お客様が来る」を尊敬語にすると正しいものはどれか。',ch:['お客様がいらっしゃる','お客様が参る','お客様が伺う','お客様がおる'],a:0,ex:'いらっしゃる。参る・伺う・おるは謙譲語。'},
  {id:'b_e32',f:'bunpo',lv:'easy',q:'「先生に会う」を謙譲語にすると正しいものはどれか。',ch:['先生にお目にかかる','先生にお会いになる','先生に会われる','先生に会いなさる'],a:0,ex:'お目にかかる。自分の動作をへりくだる。'},
  {id:'b_s13',f:'bunpo',lv:'std',q:'「先生が話される」の「れる」の意味として最も適切なものはどれか。',ch:['尊敬','受け身','可能','自発'],a:0,ex:'主語が敬意を払うべき人物なので尊敬。「話せる」と言い換えられれば可能。'},
  {id:'b_s14',f:'bunpo',lv:'std',q:'「故郷が思い出される」の「れる」の意味はどれか。',ch:['自発','受け身','可能','尊敬'],a:0,ex:'自発。自然にそうなる意味で、「思う」「案じる」など心情の動詞に付きやすい。'},
  {id:'b_s15',f:'bunpo',lv:'std',q:'「た」が完了ではなく存続の意味であるものはどれか.',ch:['壁に掛かった絵','昨日読んだ本','今着いた','食べた'],a:0,ex:'存続。「掛かっている絵」と言い換えられる。'},
  {id:'b_s16',f:'bunpo',lv:'std',q:'「らしい」が推定の助動詞であるものはどれか。',ch:['雨が降るらしい','彼は男らしい','子どもらしい服','春らしい陽気'],a:0,ex:'推定。他は「〜にふさわしい」という意味の接尾語。'},
  {id:'b_s17',f:'bunpo',lv:'std',q:'「に」が形容動詞の活用語尾であるものはどれか.',ch:['静かになる','東京に行く','友人に会う','三時に着く'],a:0,ex:'「静かだ」の連用形。他は格助詞。'},
  {id:'b_s18',f:'bunpo',lv:'std',q:'「で」が断定の助動詞「だ」の連用形であるものはどれか。',ch:['彼は学生である','バスで行く','公園で遊ぶ','喜んで'],a:0,ex:'「である」の「で」。他は場所や手段を示す格助詞、接続助詞。'},
  {id:'b_s19',f:'bunpo',lv:'std',q:'複文の説明として正しいものはどれか。',ch:['主語述語の関係が入れ子になっている','対等に2つ並ぶ','1組だけある','述語がない'],a:0,ex:'「私は彼が来ると思う」のように、従属節が文の一部になっている。'},
  {id:'b_s20',f:'bunpo',lv:'std',q:'「読まれる」が受け身である場合の主語として適切なものはどれか。',ch:['本','先生','私','だれでも'],a:0,ex:'受け身は動作を受ける側が主語。「この本は多くの人に読まれる」。'},
  {id:'b_s21',f:'bunpo',lv:'std',q:'「せる・させる」の意味はどれか。',ch:['使役','受け身','可能','尊敬'],a:0,ex:'使役。他人に動作をさせる意味。'},
  {id:'b_s22',f:'bunpo',lv:'std',q:'「まい」の意味の組み合わせとして正しいものはどれか。',ch:['打消の意志・打消の推量','過去・完了','断定・存在','尊敬・受け身'],a:0,ex:'「二度と行くまい」（意志）、「彼は来るまい」（推量）。'},
  {id:'b_s23',f:'bunpo',lv:'std',q:'「ご覧になられる」が不適切な理由はどれか.',ch:['二重敬語だから','謙譲語だから','丁寧語だから','適切である'],a:0,ex:'「ご覧になる」で尊敬語が完成しているので「られる」は不要。'},
  {id:'b_s24',f:'bunpo',lv:'std',q:'「お客様、こちらでお待ちしてください」の誤りはどれか。',ch:['謙譲語を相手の動作に使っている','二重敬語である','丁寧語が足りない','誤りはない'],a:0,ex:'「お待ちする」は謙譲語。正しくは「お待ちください」。'},
  {id:'b_h7',f:'bunpo',lv:'hard',q:'「ない」が補助形容詞であるものはどれか。',ch:['美しくない','行かない','お金がない','危ない'],a:0,ex:'補助形容詞は「〜く」に続く。「美しくはない」と「は」を入れられる。'},
  {id:'b_h8',f:'bunpo',lv:'hard',q:'「そうだ」を「様態」と「伝聞」で見分ける方法はどれか。',ch:['接続する形が違う（連用形なら様態、終止形なら伝聞）','意味だけで判断する','文末で判断する','見分けられない'],a:0,ex:'「降りそうだ」（連用形＝様態）、「降るそうだ」（終止形＝伝聞）。'},
  {id:'b_h9',f:'bunpo',lv:'hard',q:'「彼に来られて困った」の「られる」の意味はどれか。',ch:['受け身（迷惑の受け身）','可能','尊敬','自発'],a:0,ex:'自分が迷惑を被る受け身。日本語に特徴的な用法。'},
  {id:'b_h10',f:'bunpo',lv:'hard',q:'「拝見させていただきます」が過剰とされる理由はどれか。',ch:['謙譲語が二重に重なっているから','尊敬語だから','丁寧語だから','過剰ではない'],a:0,ex:'「拝見します」で十分。謙譲表現の重複は冗長になる。'},
  {id:'b_h11',f:'bunpo',lv:'hard',q:'「連体詞」と「形容動詞の連体形」を見分ける方法はどれか。',ch:['言い切りの形にできるかどうか','意味で判断する','文字数で判断する','見分けられない'],a:0,ex:'「静かな」→「静かだ」と言い切れるので形容動詞。「大きな」は「大きだ」と言えないので連体詞。'},
  {id:'b_h12',f:'bunpo',lv:'hard',q:'敬語の「謙譲語II（丁重語）」の説明として正しいものはどれか。',ch:['自分の動作を相手に対して改まって述べる','相手を高める','物事を美化する','命令を表す'],a:0,ex:'「参ります」「申します」など。動作の向かう相手を高めるのではなく、聞き手に丁重に述べる。'},
  {id:'t_e15',f:'koten',lv:'easy',q:'歴史的仮名遣い「まゐる」を現代仮名遣いに直すとどうなるか。',ch:['まいる','まゑる','まうる','まある'],a:0,ex:'「ゐ」は「い」に直す。'},
  {id:'t_e16',f:'koten',lv:'easy',q:'歴史的仮名遣い「てふ」を現代仮名遣いに直すとどうなるか。',ch:['ちょう','てう','てふ','ちゅう'],a:0,ex:'「eu」は「よう」に変わる。てふ→ちょう（蝶）。'},
  {id:'t_e17',f:'koten',lv:'easy',q:'歴史的仮名遣い「かうべ」を現代仮名遣いに直すとどうなるか。',ch:['こうべ','かうべ','こおべ','かおべ'],a:0,ex:'「au」は「おう」に変わる。かうべ→こうべ（頭）。'},
  {id:'t_e18',f:'koten',lv:'easy',q:'古文の「いみじ」の意味として適切なものはどれか。',ch:['程度がはなはだしい','忌み嫌う','神聖である','短い'],a:0,ex:'よい意味にも悪い意味にも使う。「たいそう」「ひどく」。'},
  {id:'t_e19',f:'koten',lv:'easy',q:'古文の「かしこし」の意味として適切なものはどれか。',ch:['おそれ多い・すぐれている','賢い','恐ろしい','かしこまる'],a:0,ex:'畏れ多い、また非常にすぐれているの意味。'},
  {id:'t_e20',f:'koten',lv:'easy',q:'古文の「なつかし」の意味として適切なものはどれか。',ch:['心が引かれる・親しみやすい','昔が恋しい','悲しい','うれしい'],a:0,ex:'そばにいたいと思う気持ち。現代語の「懐かしい」とは異なる。'},
  {id:'t_e21',f:'koten',lv:'easy',q:'古文の「はづかし」の意味として適切なものはどれか。',ch:['こちらが気後れするほど立派だ','恥ずかしい','みっともない','照れくさい'],a:0,ex:'相手が立派で自分が恥ずかしくなる、の意味。'},
  {id:'t_e22',f:'koten',lv:'easy',q:'古文の「ののしる」の意味として適切なものはどれか。',ch:['大声で騒ぐ','悪口を言う','ささやく','だまる'],a:0,ex:'評判になる、大騒ぎするの意味。悪口の意味は現代語。'},
  {id:'t_e23',f:'koten',lv:'easy',q:'古文の「あやし」の意味に含まれないものはどれか。',ch:['正しい','不思議だ','身分が低い','粗末だ'],a:0,ex:'不思議、賤しい、粗末などの意味をもつ。'},
  {id:'t_e24',f:'koten',lv:'easy',q:'『伊勢物語』の主人公のモデルとされる人物はだれか。',ch:['在原業平','紀貫之','菅原道真','藤原道長'],a:0,ex:'歌物語で、業平と思われる「男」の一代記の形をとる。'},
  {id:'t_e25',f:'koten',lv:'easy',q:'『おくのほそ道』の作者はだれか。',ch:['松尾芭蕉','与謝蕪村','小林一茶','井原西鶴'],a:0,ex:'松尾芭蕉。東北・北陸をめぐった紀行文。'},
  {id:'t_e26',f:'koten',lv:'easy',q:'『古今和歌集』が成立した時代はどれか。',ch:['平安時代','奈良時代','鎌倉時代','江戸時代'],a:0,ex:'平安時代初期。天皇の命で編まれた最初の勅撰和歌集。'},
  {id:'t_e27',f:'koten',lv:'easy',q:'和歌の五・七・五・七・七という形式を何というか。',ch:['短歌','俳句','川柳','長歌'],a:0,ex:'短歌。俳句と川柳は五・七・五。'},
  {id:'t_e28',f:'koten',lv:'easy',q:'俳句に必要とされる2つの要素はどれか。',ch:['季語と切れ字','季語と枕詞','切れ字と対句','枕詞と序詞'],a:0,ex:'季語で季節を示し、切れ字（や・かな・けり）で感動の中心を示す。'},
  {id:'t_s13',f:'koten',lv:'std',q:'係助詞「や」「か」の結びの活用形はどれか。',ch:['連体形','已然形','終止形','未然形'],a:0,ex:'ぞ・なむ・や・かは連体形、こそは已然形で結ぶ。'},
  {id:'t_s14',f:'koten',lv:'std',q:'古文の「さらに〜ず」の意味はどれか。',ch:['まったく〜ない','さらに〜ない','もっと〜ない','少し〜ない'],a:0,ex:'呼応の副詞。全否定を表す。'},
  {id:'t_s15',f:'koten',lv:'std',q:'古文の「え〜ず」の意味はどれか。',ch:['〜できない','〜しない','〜したくない','〜すべきでない'],a:0,ex:'不可能を表す。「え言はず」で「言うことができない」。'},
  {id:'t_s16',f:'koten',lv:'std',q:'古文の「な〜そ」の意味はどれか。',ch:['〜するな（禁止）','〜しない','〜したい','〜だろう'],a:0,ex:'柔らかい禁止。「な行きそ」で「行くな」。'},
  {id:'t_s17',f:'koten',lv:'std',q:'助動詞「き」と「けり」の違いとして正しいものはどれか。',ch:['「き」は直接体験、「けり」は伝聞や気づき','どちらも同じ','「き」は未来','「けり」は打消'],a:0,ex:'「き」は自分が経験した過去、「けり」は人から聞いた過去や詠嘆。'},
  {id:'t_s18',f:'koten',lv:'std',q:'古文の「つ」「ぬ」の意味はどれか。',ch:['完了','過去','推量','打消'],a:0,ex:'完了・強意。「てむ」「なむ」の形で強意＋推量になる。'},
  {id:'t_s19',f:'koten',lv:'std',q:'古文の「べし」の意味に含まれないものはどれか。',ch:['打消','推量','意志','当然'],a:0,ex:'推量・意志・当然・可能・命令・適当。打消は「ず」「じ」。'},
  {id:'t_s20',f:'koten',lv:'std',q:'和歌の「掛詞」の説明として正しいものはどれか。',ch:['一つの音に二つの意味を重ねる','決まった語を導く','情景を比喩で表す','対になる句を並べる'],a:0,ex:'「まつ」に「松」と「待つ」を重ねるなど。'},
  {id:'t_s21',f:'koten',lv:'std',q:'『新古今和歌集』を代表する歌人はだれか。',ch:['藤原定家','紀貫之','柿本人麻呂','大伴家持'],a:0,ex:'藤原定家。『百人一首』の撰者でもある。'},
  {id:'t_s22',f:'koten',lv:'std',q:'漢文の「再読文字」にあたるものはどれか。',ch:['未','而','於','焉'],a:0,ex:'「未」は「いまだ〜ず」と2回読む。而・於・焉は置き字。'},
  {id:'t_s23',f:'koten',lv:'std',q:'漢文「学而時習之」の書き下しとして正しいものはどれか。',ch:['学びて時に之を習ふ','学びて之を時に習ふ','時に学びて之を習ふ','之を学びて時に習ふ'],a:0,ex:'『論語』の冒頭。「而」は置き字で読まない。'},
  {id:'t_s24',f:'koten',lv:'std',q:'「一二点」と「レ点」を併用するときの読み方の原則はどれか。',ch:['レ点を先に処理する','一二点を先に処理する','どちらでもよい','併用できない'],a:0,ex:'すぐ上に返るレ点を優先し、そのあと一二点でより離れた語へ返る。'},
  {id:'t_h8',f:'koten',lv:'hard',q:'「あり」の活用の種類はどれか。',ch:['ラ行変格活用','四段活用','上二段活用','下二段活用'],a:0,ex:'ラ変。あり・をり・はべり・いまそかりの4語。終止形がイ段で終わる点が特徴。'},

function load(){
  try{const raw=localStorage.getItem(STORE_KEY);if(raw)return JSON.parse(raw);
    const init={stats:{},best:{}};localStorage.setItem(STORE_KEY,JSON.stringify(init));return init;
  }catch(e){if(!mem)mem={stats:{},best:{}};return mem;}
}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){mem=state;}}
let state=load();
if(!state.stats)state.stats={};
if(!state.best)state.best={};
if(state.xp==null)state.xp=0;
if(state.maxCombo==null)state.maxCombo=0;
if(!state.ach)state.ach=[];
if(!state.streak)state.streak={day:'',count:0};
if(state.taBest==null)state.taBest=0;
if(!state.stat)state.stat={day:'',dayQ:0,fields:[],peakWeak:0};
if(!state.vstat)state.vstat={};
if(state.vreadDone==null)state.vreadDone=0;
if(state.dailyDone==null)state.dailyDone=0;
function bumpQ(){
  const t=todayStr();
  if(state.stat.day!==t){state.stat.day=t;state.stat.dayQ=0;}
  state.stat.dayQ++;
  const h=new Date().getHours();
  if(h<5)unlock('nightowl'); else if(h<8)unlock('earlybird');
  if(state.stat.dayQ>=50)unlock('marathon');
  save();
}
if(!state.cards)state.cards=[];
if(!state.cardCount){
  state.cardCount={};
  (state.cards||[]).forEach(id=>{state.cardCount[id]=(state.cardCount[id]||0)+1;});
}

function grantCard(){
  chime('card');
  const cnt=state.cardCount||(state.cardCount={});
  const owned=id=>(cnt[id]||0)>0;
  // 未所持は重み3倍。重複も出るが新規が出やすい
  const W={N:6,R:3,SR:1,H:0};
  const build=arr=>{
    let tot=0; const w=arr.map(c=>{const v=(W[c.r]||1)*(owned(c.id)?1:3); tot+=v; return v;});
    return {arr,w,tot};
  };
  const draw=pool=>{
    const {arr,w,tot}=build(pool);
    let x=Math.random()*tot;
    for(let i=0;i<arr.length;i++){x-=w[i];if(x<=0)return arr[i];}
    return arr[arr.length-1];
  };
  const give=(c,isHidden)=>{
    cnt[c.id]=(cnt[c.id]||0)+1;
    if(!state.cards.includes(c.id))state.cards.push(c.id);
    save();
    const dup=cnt[c.id]>1;
    const msg=isHidden
      ? '🔮 隠し図鑑を発見！ '+c.e+' '+c.n+(dup?'（重複 ×'+cnt[c.id]+'）':'')
      : '📖 図鑑に追加: '+c.e+' '+c.n+(dup?'（重複 ×'+cnt[c.id]+'）':(c.r==='SR'?'（超レア！）':c.r==='R'?'（レア）':''));
    setTimeout(()=>{toast(msg);pop(dup?6:20);},1400);
  };
  const hid=CARDS.filter(c=>c.r==='H');
  const newHid=hid.filter(c=>!owned(c.id));
  if(hid.length&&Math.random()<0.04){
    give(newHid.length?newHid[Math.floor(Math.random()*newHid.length)]
                      :hid[Math.floor(Math.random()*hid.length)],true);
    return;
  }
  const pool=CARDS.filter(c=>c.r!=='H');
  if(!pool.length)return;
  give(draw(pool),false);
}

const MAXLV=20;
function xpNeed(l){return 40*l+2*l*l;}
function lvlInfo(xp){
  let l=1,acc=0,need=xpNeed(1);
  while(l<MAXLV&&xp>=acc+need){acc+=need;l++;need=xpNeed(l);}
  if(l>=MAXLV)return{level:MAXLV,cur:Math.max(0,xp-acc),need:xpNeed(MAXLV),max:true};
  return{level:l,cur:xp-acc,need};
}

   最初のタップで無音を1回鳴らして解除し、以後は節目でも鳴らせるようにする。 */
let _acReady=false;
function _audio(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    if(!window._ac)window._ac=new AC();
    const ac=window._ac;
    if(ac.state==='suspended')ac.resume();
    return ac;
  }catch(e){ return null; }
}
function unlockAudio(){
  const ac=_audio();
  if(!ac||_acReady)return;
  try{
    const b=ac.createBuffer(1,1,22050), s=ac.createBufferSource();
    s.buffer=b; s.connect(ac.destination); s.start(0);
    _acReady=true;
  }catch(e){}
}
['touchend','pointerdown','click','keydown'].forEach(function(ev){
  document.addEventListener(ev, unlockAudio, {passive:true});
});
let _chimeAt=0;
function chime(kind){
  if(!soundOn())return;
  const now=Date.now();
  if(now-_chimeAt<450)return;     // レベルアップと図鑑が同時に来たときの二度鳴りを防ぐ
  _chimeAt=now;
  const ac=_audio();
  if(!ac)return;
  try{
    const seq = kind==='level' ? [[523.25,0],[659.25,.10],[783.99,.20],[1046.50,.30]]
              : kind==='card'  ? [[880.00,0],[1174.66,.09]]
              :                  [[659.25,0],[783.99,.10],[1046.50,.20]];
    const dur = kind==='level'?.42:.30;
    seq.forEach(function(p){
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=p[0];
      const t=ac.currentTime+p[1];
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(.16,t+.012);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t+dur+.03);
    });
  }catch(e){}
}

/* 語彙データは data/*.json から読み込む。
   本体（4択問題）は index.html に入っているので、読み込めなくてもアプリは動く。 */
const VDIR='data/';
let V=[], VMETA=null, VREAD=[], VMEAN=[], vLoad='loading';
async function loadVocab(){
  try{
    const idx=await (await fetch(VDIR+'index.json',{cache:'no-cache'})).json();
    const parts=await Promise.all(idx.sets.map(async st=>{
      const doc=await (await fetch(VDIR+st.file,{cache:'no-cache'})).json();
      return doc.items.map(o=>Object.assign({c:st.id},o));
    }));
    VMETA=idx; V=[].concat.apply([],parts);
    VREAD=V.filter(v=>v.r); VMEAN=V.filter(v=>v.m);
    vLoad=V.length?'ok':'empty';
  }catch(e){ vLoad='fail'; }
  if(document.querySelector('.statcard'))renderHome();   // ホーム表示中なら語数を出し直す
}
const VCN={kanji:'漢字の読み',yoji:'四字熟語',kotowaza:'ことわざ・慣用句',kobun:'古文単語'};
const V_N=20;
function vName(c){
  const st=VMETA&&VMETA.sets.find(x=>x.id===c);
  return (st&&st.name)||VCN[c]||c;
}
function vNorm(x){return String(x||'').trim().replace(/\s/g,'')
  .replace(/[ァ-ヶ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60));}  // カタカナで書いても正解にする
function vOk(v,input){
  const t=vNorm(input);
  if(!t)return false;
  if(t===vNorm(v.r))return true;
  return (v.alt||[]).some(a=>t===vNorm(a));
}
function vScore(v,today){
  const s=state.vstat[v.i];
  if(!s||(s.c+s.w)===0)return 40;
  const el=Math.max(0,s.d?today-s.d:60);
  if(s.w>0&&s.c<=s.w)return 100+Math.min(s.wd?today-s.wd:el,30)*2;
  const k=Math.max(0,Math.min(5,s.c-s.w*2)),iv=[1,2,4,8,16,32][k];
  const due=el-iv;
  return due>=0?60+Math.min(due,30):15+due;
}
function vPick(pool,n){
  const today=dayNum();
  const sc=pool.map(v=>({v:v,s:vScore(v,today)+Math.random()*6})).sort((a,b)=>b.s-a.s);
  return shuffle(sc.slice(0,Math.max(n,Math.min(pool.length,n))).map(x=>x.v)).slice(0,n);
}
function vMark(v,ok){
  const s=state.vstat[v.i]||{c:0,w:0};
  if(ok)s.c++; else {s.w++;s.wd=dayNum();}
  s.d=dayNum(); state.vstat[v.i]=s; save();
}

  if(!vGuard())return;

  if(list.length<3){toast('語彙データが足りないよ');return;}
  vr={list:list,i:0,score:0,miss:[],answered:false,hint:0,combo:0,maxCombo:0,t0:Date.now()};

}
function vHintText(v){
  const r=v.r;
  if(vr.hint<=0)return '';
  if(vr.hint===1)return r.length+' 文字';
  if(vr.hint===2)return r[0]+'○'.repeat(r.length-1);
  return r.split('').map((ch,k)=>k%2===0?ch:'○').join('');
}

        ${vr.answered?'disabled':''} onkeydown="if(event.key==='Enter')vSubmit()">

                  :`<button class="btn btn-ghost" onclick="vHint()">💡 ヒント（あと${3-vr.hint}回）</button>`}
      <button class="btn btn-primary" onclick="vSubmit()">こたえる</button>

function vHint(){ if(vr.answered)return; vr.last=($('vinp')||{}).value||''; if(vr.hint<3)vr.hint++; renderVRead(); }
function vSubmit(){
  if(vr.answered)return;
  const val=($('vinp')||{}).value||'';
  if(!val.trim()){toast('ひらがなで書いてね');return;}
  vr.answered=true; vr.last=val;
  const v=vr.list[vr.i],ok=vOk(v,val);
  bumpQ();
  if(ok){vr.score++;vr.combo++;vr.maxCombo=Math.max(vr.maxCombo,vr.combo);
    if(vr.combo>state.maxCombo)state.maxCombo=vr.combo;
    addXp((vr.hint>=2?8:vr.hint===1?12:15)+(vr.combo>=5?10:vr.combo>=3?5:0));
    touchStreak();pop(vr.combo>=3?14:8);}
  else{vr.combo=0;vr.miss.push(v);}
  vMark(v,ok);checkAch();renderVRead();
}
function vReadFb(){
  const v=vr.list[vr.i],ok=vOk(v,vr.last);
  return `<div class="exp"><b>${ok?'⭕ 正解':'❌ 正解は「'+esc(v.r)+'」'}</b>${
    (v.alt&&v.alt.length)?'　（'+v.alt.map(esc).join('・')+' も可）':''}${v.m?'　'+esc(v.m):(v.h?'　'+esc(v.h):'')}</div>
    <div class="row2" style="margin-top:12px">
      ${ok?'':`<button class="btn btn-ghost" onclick="vRetry()">もう一度書く</button>`}
      <button class="btn btn-primary" onclick="vNext()">次へ ›</button></div>`;
}
function vRetry(){ vr.answered=false; vr.last=''; vr.hint=2; renderVRead(); }
function vNext(){ vr.i++; vr.answered=false; vr.hint=0; vr.last=''; renderVRead(); }
function renderVReadResult(){
  const total=vr.list.length,rate=Math.round(vr.score/total*100),rk=rankOf(rate);
  state.vreadDone=(state.vreadDone||0)+1;
  unlock('first');
  if(vr.score===total&&total>=10)unlock('vperfect');
  save();checkAch();
  const per={};
  vr.list.forEach(v=>{per[v.c]=per[v.c]||{n:0,ng:0};per[v.c].n++;});
  vr.miss.forEach(v=>{if(per[v.c])per[v.c].ng++;});
  const rows=Object.keys(per).map(c=>{const r=per[c],ok=r.n-r.ng,p=ok/r.n*100;
    return `<div class="catrow"><span class="cn">${vName(c)}</span>
      <span class="catbar"><i class="${p<50?'bad':p<100?'mid':''}" style="width:${p}%"></i></span>
      <span class="cv">${ok}/${r.n}</span></div>`;}).join('');
  const miss=vr.miss.length?`<div class="label" style="margin-top:4px">まちがえた語</div>
    <div class="misslist">${vr.miss.map(v=>`<div class="r"><div class="q">${esc(v.w)}　${esc(v.r)}</div>
      ${v.m?`<div class="a">${esc(v.m)}</div>`:''}</div>`).join('')}</div>`:'';
  screen.innerHTML=`
    <button class="back" onclick="renderHome()">‹ もどる</button>
    <div class="result"><div class="rank">${rk}</div>
      <div class="big">${vr.score}<span style="font-size:22px;color:var(--sub)">/${total}</span></div>
      <h2>${rate===100?'全問正解！':rate>=80?'いい調子！':rate>=50?'ここが伸びしろ':'くりかえしが力になるよ'}</h2>
      <p>正答率 ${rate}% ／ 最大 ${vr.maxCombo} コンボ</p></div>
    <div class="label">📊 種類べつ</div>
    <div class="statcard" style="display:block;padding:12px 16px">${rows}</div>
    ${miss}
    <p class="help" style="text-align:center;margin:10px 0 0">まちがえた語は、日をおいてまた出てくるよ</p>
    <div class="row2" style="margin-top:10px">
      <button class="btn btn-ghost" onclick="renderHome()">ホーム</button>
      <button class="btn btn-primary" onclick="startVRead()">もう一度</button></div>`;
}

              :`<div class="vword ${v.w.length>6?'sm':''}">${esc(v.w)}</div>`}

function vFlip(){ vc.flip=!vc.flip; renderVCard(); }
function vMove(n){ vc.i=(vc.i+n+vc.list.length)%vc.list.length; vc.flip=false; renderVCard(); }
function vCardMark(ok){
  const v=vc.list[vc.i];
  vMark(v,ok); bumpQ();
  if(ok){addXp(4);touchStreak();}
  toast(ok?'ナイス +4XP':'OK、あとでまた出すね');
  if(vc.i<vc.list.length-1){vc.i++;vc.flip=false;renderVCard();}
  else{vc.flip=false;renderVCard();}
}

/* ===================== 今日の10問 =====================
   苦手 → そろそろ忘れそうな問題 → まだ解いていない問題、の順に優先度をつけて
   毎日10問だけ選ぶ。たまった数は表に出さない。                        */
const DAILY_N=10, DAILY_WEAK_MAX=4, DAILY_NEW_MAX=4, DAILY_NEW_MIN=2;
function isNewQ(q){ return !state.stats[q.id]; }
function isWeakQ(q){ const s=state.stats[q.id]; return !!(s&&s.w>0&&s.c<=s.w); }
function ivlOfQ(q){ const s=state.stats[q.id]||{c:0,w:0};
  const k=Math.max(0,Math.min(5,(s.c|0)-(s.w|0)*2)); return [1,2,4,8,16,32][k]; }
function dailyScore(q,today){
  const s=state.stats[q.id];
  let sc;
  if(!s) sc=40;                                              // まだ解いていない
  else{
    const el=s.d?today-s.d:60;                               // 何日ぶりか
    if(isWeakQ(q)) sc=100+Math.min(s.wd?today-s.wd:el,30)*2; // 苦手。まちがえてから日が経つほど上げる
    else{ const due=el-ivlOfQ(q); sc=due>=0?60+Math.min(due,30):15+due; }
  }
  if(s&&s.d===today) sc-=1000;                               // 今日もう解いた問題は最後に回す
  return sc+Math.random()*6;
}
function buildDaily(){
  const all=pool('all',curLv);
  if(all.length<4)return [];
  const today=dayNum();
  const sc=all.map(q=>({q:q,s:dailyScore(q,today)})).sort((a,b)=>b.s-a.s);
  const pick=[],used=new Set();
  let nw=0,nn=0;
  for(const it of sc){                                       // 苦手と新規に上限をつけて配合する
    if(pick.length>=DAILY_N)break;
    if(isWeakQ(it.q)){ if(nw>=DAILY_WEAK_MAX)continue; nw++; }
    else if(isNewQ(it.q)){ if(nn>=DAILY_NEW_MAX)continue; nn++; }
    pick.push(it.q);used.add(it.q.id);
  }
  for(const it of sc){                                       // 足りなければ上限を外して補充
    if(pick.length>=DAILY_N)break;
    if(!used.has(it.q.id)){pick.push(it.q);used.add(it.q.id);}
  }
  let now=pick.filter(isNewQ).length;                        // 新しい問題を最低でも数問は入れる
  if(now<DAILY_NEW_MIN){
    for(const it of sc){
      if(now>=DAILY_NEW_MIN)break;
      if(used.has(it.q.id)||!isNewQ(it.q))continue;
      let k=-1;
      for(let j=pick.length-1;j>=0;j--){ if(!isWeakQ(pick[j])&&!isNewQ(pick[j])){k=j;break;} }
      if(k<0)break;
      used.delete(pick[k].id); pick[k]=it.q; used.add(it.q.id); now++;
    }
  }
  return shuffle(pick).slice(0,DAILY_N);
}
function daily(){
  const t=todayStr();
  const d0=state.daily;
  // まだ1問も解いていないときだけ、レベルの変更で作り直す。
  // 解きはじめたあとにレベルを変えても、その日のぶんの進み具合は残す
  const started=!!d0&&((d0.ok.length+d0.ng.length)>0||d0.fin);
  if(!d0||d0.d!==t||(d0.lv!==curLv&&!started)){
    const l=buildDaily();
    if(!l.length)return null;
    state.daily={d:t,lv:curLv,ids:l.map(q=>q.id),ok:[],ng:[],fin:false};
    save();
  }
  return state.daily;
}
function dailyQs(){
  const d=state.daily; if(!d)return [];
  const m=new Map(Q.map(q=>[q.id,q]));
  return d.ids.map(i=>m.get(i)).filter(Boolean);
}
function dailyCard(){
  const d=daily(); if(!d)return '';
  const tot=d.ids.length,done=d.ok.length+d.ng.length,fin=d.fin||done>=tot;
  let sub,go;
  if(fin){ sub='おわり！ '+d.ok.length+'/'+done+' 正解'; go='もう一度'; }
  else if(done>0){ sub='あと '+(tot-done)+' 問'; go='つづき'; }
  else { sub='苦手と新しい問題をまぜてあるよ'; go='はじめる'; }
  return `<div class="daily${fin?' done':''}" onclick="startDaily()">
      <div class="dic">${fin?'🎉':'☀️'}</div>
      <div class="dbd"><h3>今日の${DAILY_N}問</h3><p>${sub}</p>${
        (done>0&&!fin)?`<div class="dbar"><i style="width:${Math.round(done/tot*100)}%"></i></div>`:''}</div>
      <div class="dgo">${go} ›</div>
    </div>`;
}
function startDaily(){
  const d=daily();
  if(!d){toast('問題がまだ足りないよ');return;}
  const done=new Set(d.ok.concat(d.ng));
  let list=dailyQs().filter(q=>!done.has(q.id));
  if(!list.length)list=dailyQs();            // やり終わっていたら同じ10問でもう一周（記録は据え置き）
  if(!list.length){toast('問題がまだ足りないよ');return;}
  clearInterval(g.timer);
  g={list:list,i:0,score:0,miss:[],answered:false,combo:0,maxCombo:0,ta:false,t:0,timer:null,field:'daily',daily:true};
  renderQuiz();
}
function retryDailyMiss(){
  const list=g.miss.slice();
  if(!list.length){renderHome();return;}
  g={list:list,i:0,score:0,miss:[],answered:false,combo:0,maxCombo:0,ta:false,t:0,timer:null,field:'daily',daily:true};
  renderQuiz();
}
function finishDaily(){
  clearInterval(g.timer);
  const d=state.daily,total=g.list.length,rate=Math.round(g.score/total*100),rk=rankOf(rate);
  const alldone=!!d&&(d.ok.length+d.ng.length)>=d.ids.length;
  if(alldone&&d&&!d.fin){ d.fin=true; state.dailyDone=(state.dailyDone||0)+1; save(); chime('daily'); }
  unlock('first');
  if(total>=DAILY_N&&g.score===total)unlock('perfect');
  checkAch();
  const msg=rate===100?'全問正解！かんぺき':rate>=80?'いい調子！':rate>=50?'ここが伸びしろ':'今日のぶん、やりきったね';
  const miss=g.miss.length?`<div class="label" style="margin-top:4px">まちがえた問題（明日また出るよ）</div>
    <div class="misslist">${g.miss.map(q=>`<div class="r"><div class="q">${esc(q.q)}</div><div class="a">正解: ${esc(q.ch[q.a])}</div></div>`).join('')}</div>`:'';
  screen.innerHTML=`
    <button class="back" onclick="renderHome()">‹ もどる</button>
    <div class="result">
      <div class="rank">${rk}</div>
      <div class="big">${g.score}<span style="font-size:22px;color:var(--sub)">/${total}</span></div>
      <h2>${msg}</h2>
      <p>${alldone?'今日のぶんは完了':'あと '+Math.max(0,d.ids.length-(d.ok.length+d.ng.length))+' 問'}${
        state.streak.count>=2?' ／ 🔥'+state.streak.count+'日連続':''}</p>
    </div>
    ${miss}
    <p class="help" style="text-align:center;margin:10px 0 0">明日はまた新しい${DAILY_N}問が出るよ</p>
    <div class="row2" style="margin-top:10px">
      <button class="btn btn-ghost" onclick="renderHome()">ホーム</button>
      ${g.miss.length?`<button class="btn btn-primary" onclick="retryDailyMiss()">まちがえた ${g.miss.length} 問をもう一度</button>`
                     :`<button class="btn btn-primary" onclick="startDaily()">もう一度</button>`}
    </div>`;
  if(rate>=85)setTimeout(()=>pop(18),200);
}

function startQuiz(field,ta){
  let list;
  if(field==='weak'){list=shuffle(weak());if(!list.length){toast('苦手はまだないよ');return;}list=list.slice(0,10);}
  else{list=pool(field,curLv);
    if(list.length<4){toast('この条件の問題が足りないよ');return;}
    list=shuffle(list).slice(0,ta?40:10);}
  g={list,i:0,score:0,miss:[],answered:false,combo:0,maxCombo:0,ta:!!ta,t:ta?60:0,timer:null,field};
  renderQuiz();
}
function renderQuiz(){
  if(g.i>=g.list.length)return finish();
  clearInterval(g.timer);
  const q=g.list[g.i];g.answered=false;
  const opts=shuffle(q.ch.map((c,k)=>({c,k})));
  screen.innerHTML=`
    <button class="back" onclick="quitQuiz()">‹ もどる</button>
    <div class="qhead"><div class="left"><h2>${g.ta?'⏱ タイムアタック':'📝 クイズ'}</h2>
      ${g.combo>=2?`<span class="combo">🔥 ${g.combo}コンボ</span>`:''}</div>
      ${g.ta?`<span class="timer" id="tm">${g.t}</span>`:`<span class="combo">${g.i+1}/${g.list.length}</span>`}</div>
    <div class="bar-top"><i style="width:${g.i/g.list.length*100}%"></i></div>
    <div class="qcard">
      <div class="qmeta"><span class="tagf">${esc(fieldName(q.f))}</span><span class="taglv ${q.lv}">${LV[q.lv].n}</span></div>
      <div class="qtext">${esc(q.q)}</div>
    </div>
    <div class="choices">${opts.map(o=>`<button class="choice" data-k="${o.k}" onclick="answer(${o.k})">${esc(o.c)}</button>`).join('')}</div>
    <div id="fb"></div>`;
  if(g.ta){g.timer=setInterval(()=>{g.t--;const el=$('tm');
    if(el){el.textContent=g.t;if(g.t<=5)el.classList.add('warn');}
    if(g.t<=0){clearInterval(g.timer);g.answered=true;finish();}},1000);}
}
function answer(k){
  if(g.answered)return;g.answered=true;clearInterval(g.timer);
  const q=g.list[g.i],ok=k===q.a;
  document.querySelectorAll('.choice').forEach(b=>{const kk=+b.dataset.k;
    if(kk===q.a)b.classList.add('correct');else if(kk===k)b.classList.add('wrong');else b.classList.add('dim');b.onclick=null;});
  const st=state.stats[q.id]||{c:0,w:0};
  bumpQ();
  if(ok)setTimeout(checkCardMilestone,50);
  if(!state.stat.fields)state.stat.fields=[];
  if(!state.stat.fields.includes(q.f)){state.stat.fields.push(q.f);}
  if(ok){g.score++;g.combo++;g.maxCombo=Math.max(g.maxCombo,g.combo);
    if(g.combo>state.maxCombo)state.maxCombo=g.combo;
    st.c++;
    addXp(XPLV[q.lv]+(g.combo>=5?10:g.combo>=3?5:0));touchStreak();
    pop(g.combo>=3?14:8);}
  else{g.combo=0;g.miss.push(q);st.w++;}
  st.d=dayNum(); if(!ok)st.wd=st.d;
  if(g.daily&&state.daily&&!state.daily.ok.includes(q.id)&&!state.daily.ng.includes(q.id))
    (ok?state.daily.ok:state.daily.ng).push(q.id);
  state.stats[q.id]=st;save();
  const head=k===-1?'⏰ 時間切れ':(ok?'⭕ 正解':'❌ 不正解');
  $('fb').innerHTML=`<div class="exp"><b>${head}</b>　${esc(q.ex)}</div>
    <button class="btn btn-primary" style="margin-top:12px" onclick="next()">次へ ›</button>`;
  $('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function next(){g.i++;renderQuiz();}
function quitQuiz(){clearInterval(g.timer);renderHome();}
function finish(){
  if(g.daily)return finishDaily();
  clearInterval(g.timer);
  const total=g.list.length,rate=Math.round(g.score/total*100),rk=rankOf(rate);
  const key=(g.field||'all')+'_'+curLv+(g.ta?'_ta':'');
  const prev=state.best[key]||0;const isBest=g.score>prev;
  if(isBest){state.best[key]=g.score;save();}
  unlock('first');
  if(g.ta&&g.score>state.taBest){state.taBest=g.score;save();}
  if(!g.ta&&total>=10&&g.score===total)unlock('perfect');
  checkAch();
  const msg={S:'完璧！文句なし',A:'すばらしい理解度',B:'いい調子、あと少し',C:'解説を読んで固めよう',D:'まずは易しめから'}[rk];
  const miss=g.miss.length?`<div class="label" style="margin-top:4px">まちがえた問題</div>
    <div class="misslist">${g.miss.map(q=>`<div class="r"><div class="q">${esc(q.q)}</div><div class="a">正解: ${esc(q.ch[q.a])}</div></div>`).join('')}</div>`:'';
  screen.innerHTML=`
    <button class="back" onclick="renderHome()">‹ もどる</button>
    <div class="result">
      <div class="rank">${rk}</div>
      <div class="big">${g.score}<span style="font-size:22px;color:var(--sub)">/${total}</span></div>
      <h2>${msg}</h2>
      <p>正答率 ${rate}% ／ 最大 ${g.maxCombo} コンボ</p>
      ${isBest?'<p style="color:var(--accent);font-weight:800">🏅 自己ベスト更新！</p>':`<p>この条件のベスト: ${Math.max(prev,g.score)}問</p>`}
    </div>
    ${miss}
    <div class="row2" style="margin-top:8px">
      <button class="btn btn-ghost" onclick="renderHome()">ホーム</button>
      <button class="btn btn-primary" onclick="startQuiz('${g.field}',${g.ta})">もう一回</button>
    </div>`;
  if(rate>=85)setTimeout(()=>pop(18),200);
}
renderHome();
setTimeout(()=>checkUpdate(true),1500);
